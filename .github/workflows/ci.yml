name: CI

# Pull-request gate for the scheduled routines (TASKS/AUTOMATION.md): the auditor merges a PR only
# when this is green. Pushes to main are built by deploy.yml.

on:
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - run: npm ci
      # typecheck, validate:data, tests, Vite build, and profile pages
      - run: npm run build
      - run: git diff --check origin/${{ github.base_ref }}...HEAD
        if: github.event_name == 'pull_request'
