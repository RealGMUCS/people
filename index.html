<!DOCTYPE html>
<!--
          _/\\
         /  \\      GMU CS Directory
        /_/\_\\     an open, version-controlled academic directory
          ||
     view source encouraged · https://github.com/RealGMUCS/people
-->
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GMU CS Directory — People</title>
    <meta name="description"
        content="Searchable directory of George Mason University Computer Science faculty, research interests, and achievements." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@500;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="./src/style.css">
</head>

<body>
    <div id="app">
        <header>
            <div class="title-row">
                <a class="site-title-link" href="./" aria-label="GMU CS Directory">
                    <h1>GMU CS Directory</h1>
                </a>
                <a class="icon-link github-link" href="https://github.com/RealGMUCS/people" target="_blank"
                    rel="noopener noreferrer" aria-label="GitHub repository" title="GitHub repository">
                    <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
                        <path
                            d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z" />
                    </svg>
                </a>
            </div>
            <nav class="top-nav" aria-label="Primary navigation">
                <a href="./" id="nav-people" class="active">Faculty/Staff</a>
                <a href="students.html" id="nav-students">Students/Alumni</a>
            </nav>
        </header>

        <div class="search-section">
            <div class="page-links" id="page-links">
                <a href="?view=awards" id="awards-link">🏆 Faculty Awards</a>
                <a href="submit.html">✍️ Submit / Update</a>
            </div>

            <div class="search-container">
                <div class="search-fields">
                    <div class="search-input-shell">
                        <button type="button" id="search-scope-chip" class="search-scope-chip" hidden
                            aria-label="Remove search scope">
                            <span id="search-scope-chip-label"></span>
                            <span class="search-scope-chip-remove" aria-hidden="true">×</span>
                        </button>
                        <input type="search" id="main-search" role="combobox" aria-autocomplete="list"
                            aria-expanded="false" aria-controls="search-suggestion-panel"
                            placeholder="Search by name, area, rank… try research:, honors:, phd:, #AI" autofocus>
                    </div>
                    <div id="search-suggestion-panel" class="search-suggestion-panel" role="listbox" hidden></div>
                </div>
                <button type="button" id="search-help-btn" class="search-help-btn" aria-haspopup="dialog"
                    aria-expanded="false" aria-controls="search-help-panel" aria-label="Search syntax help"
                    title="Search syntax help">i</button>
                <div id="search-help-panel" class="search-help-panel" role="dialog" aria-label="Search syntax help"
                    hidden>
                    <p>Type a keyword prefix to search one field directly:</p>
                    <ul id="search-help-list"></ul>
                </div>
            </div>
            <output id="command-output" class="command-output" hidden></output>
            <div id="query-plan" class="query-plan" aria-live="polite"></div>

            <div class="filters" id="filters">
                <div class="filter-group">
                    <label for="type-filter">Type</label>
                    <select id="type-filter" class="field-select">
                        <option value="all">All</option>
                        <option value="Tenured">Tenured</option>
                        <option value="Tenure-Track">Tenure-Track</option>
                        <option value="Teaching">Teaching</option>
                        <option value="Staff">Staff</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="rank-filter">Rank</label>
                    <select id="rank-filter" class="field-select">
                        <option value="all">All</option>
                        <option value="Professor">Professor</option>
                        <option value="Associate">Associate</option>
                        <option value="Assistant">Assistant</option>
                        <option value="Emeritus">Emeritus</option>
                        <option value="Affiliate">Affiliate</option>
                    </select>
                </div>

                <div class="filter-group">
                    <label for="sort-order">Sort</label>
                    <select id="sort-order" class="field-select">
                        <option value="name-asc">Faculty Name (A–Z)</option>
                        <option value="name-desc">Faculty Name (Z–A)</option>
                        <option value="recent">Recently Modified</option>
                    </select>
                </div>
            </div>

            <div class="search-examples" aria-label="Example searches">
                <div class="search-examples-row" id="search-example-fixed"></div>
                <div class="search-examples-row" id="search-example-items"></div>
            </div>
        </div>

        <!-- Active interest filter banner -->
        <div id="active-filter" class="active-filter-banner" style="display:none;">
            <span id="active-filter-text"></span>
            <button id="clear-filter" aria-label="Clear filter">✕</button>
        </div>

        <div id="faculty-count" class="faculty-count"></div>

        <main>
            <section id="faculty-results" class="results-grid"></section>
        </main>
    </div>

    <script type="module" src="/src/main.js"></script>
</body>

</html>
